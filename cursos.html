<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>William BM - Cursos Realizados</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>William Bragagnollo Montini</h1>
        <nav>
            <ul>
                <li><a href="index.html">Sobre Mim</a></li>
                <li><a href="index.html#contato">Contato</a></li>
                <li><a href="cursos.html" aria-current="page">Cursos Realizados</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <h2>Cursos Realizados</h2>

            <div class="filtros">
                <div>
                    <label for="busca">Buscar</label>
                    <input type="search" id="busca" placeholder="Nome do curso, instituição ou tecnologia">
                </div>
                <div>
                    <label for="filtro-instituicao">Instituição</label>
                    <select id="filtro-instituicao">
                        <option value="">Todas</option>
                    </select>
                </div>
                <div>
                    <label for="ordem">Ordenar por</label>
                    <select id="ordem">
                        <option value="recentes">Mais recentes</option>
                        <option value="antigos">Mais antigos</option>
                        <option value="titulo">Título (A-Z)</option>
                    </select>
                </div>
            </div>

            <div class="chips" id="filtro-tags" aria-label="Filtrar por tecnologia"></div>

            <div class="barra-resumo">
                <span id="resumo" aria-live="polite">Carregando...</span>
                <button type="button" id="limpar" class="link-botao">Limpar filtros</button>
            </div>

            <div class="grade" id="lista-cursos"></div>
            <p class="vazio" id="vazio" hidden>Nenhum curso encontrado com esses filtros.</p>
        </section>
    </main>
    <footer>
        <p>&copy; 2024 Meu Perfil de Desenvolvedor</p>
    </footer>

    <script src="cursos.js"></script>
</body>
</html>
